<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-labelledby="title desc">
  <title id="title">The life of one API call</title>
  <desc id="desc">Config and secrets (sections 9 and 10) feed one httpx2 client (section 6). The client sends a request (sections 2, 3 and 5) over HTTP (section 1). The response (section 4) is validated with Pydantic (section 5) on success; on an error status or no response, section 7 decides whether to retry through the client or fix the request. Section 11 does all of it in one script.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13.5px; fill: #59636e; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 13px; }
    .muted { fill: #59636e; }
    .b { font-weight: 600; }
    .badge { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .arrow { fill: none; stroke: #6e7781; stroke-width: 1.6; }
    .sec { fill: #ffeff7; stroke: #bf3989; stroke-width: 1.5; }
    .neu { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .req { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .res { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .retry { fill: #fff8c5; stroke: #bf8700; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/>
    </marker>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="859" height="459" rx="14"/>
  <text class="title" x="28" y="40">The life of one API call</text>
  <text class="sub" x="28" y="64">Each box is one part of this chapter (§ = section). Follow the arrows from the config to the answer.</text>

  <!-- Row 1: config -> client -> request -> network -->
  <rect class="sec" x="24" y="88" width="176" height="136" rx="10"/>
  <rect x="36" y="100" width="74" height="22" rx="11" fill="#bf3989"/>
  <text class="badge" x="73" y="116" text-anchor="middle">§9 · §10</text>
  <text class="h" x="38" y="148">Config &amp; secrets</text>
  <text class="s" x="38" y="170">API key + base URL</text>
  <text class="s" x="38" y="189">from the environment,</text>
  <text class="s" x="38" y="208">never in the code</text>

  <rect class="neu" x="234" y="88" width="176" height="136" rx="10"/>
  <rect x="246" y="100" width="36" height="22" rx="11" fill="#57606a"/>
  <text class="badge" x="264" y="116" text-anchor="middle">§6</text>
  <text class="h" x="248" y="148">One httpx2 client</text>
  <text class="s" x="248" y="170">base_url + headers</text>
  <text class="s" x="248" y="189">(the key) + timeout,</text>
  <text class="s" x="248" y="208">reused for every call</text>

  <rect class="req" x="444" y="88" width="176" height="136" rx="10"/>
  <rect x="456" y="100" width="100" height="22" rx="11" fill="#0969da"/>
  <text class="badge" x="506" y="116" text-anchor="middle">§2 · §3 · §5</text>
  <text class="h" x="458" y="148">The request</text>
  <text class="s" x="458" y="170">method + URL</text>
  <text class="s" x="458" y="189">+ headers (the key)</text>
  <text class="s" x="458" y="208">+ JSON body</text>

  <rect class="neu" x="654" y="88" width="176" height="136" rx="10"/>
  <rect x="666" y="100" width="36" height="22" rx="11" fill="#57606a"/>
  <text class="badge" x="684" y="116" text-anchor="middle">§1</text>
  <text class="h" x="668" y="148">HTTP on the wire</text>
  <text class="s" x="668" y="170">a TCP connection,</text>
  <text class="s" x="668" y="189">maybe proxies,</text>
  <text class="s" x="668" y="208">then the server</text>

  <path class="arrow" d="M202 156 H230" marker-end="url(#ag)"/>
  <path class="arrow" d="M412 156 H440" marker-end="url(#ag)"/>
  <path class="arrow" d="M622 156 H650" marker-end="url(#ag)"/>
  <path class="arrow" d="M742 226 V272" marker-end="url(#ag)"/>

  <!-- Row 2: (section 11 note) | errors | validate <- response -->
  <rect x="24" y="276" width="176" height="136" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="36" y="288" width="44" height="22" rx="11" fill="#57606a"/>
  <text class="badge" x="58" y="304" text-anchor="middle">§11</text>
  <text class="h" x="38" y="336">All of it at once</text>
  <text class="s" x="38" y="358">an LLM call with no</text>
  <text class="s" x="38" y="377">SDK, in one script:</text>
  <text class="mono" x="38" y="397">07_raw_llm_call.py</text>

  <rect class="retry" x="234" y="276" width="176" height="136" rx="10"/>
  <rect x="246" y="288" width="36" height="22" rx="11" fill="#9a6700"/>
  <text class="badge" x="264" y="304" text-anchor="middle">§7</text>
  <text class="h" x="248" y="336">Error?</text>
  <text class="s" x="248" y="358">429, 5xx, timeout:</text>
  <text class="s" x="248" y="377">wait, then retry</text>
  <text class="s" x="248" y="396">other 4xx: fix it</text>

  <rect class="ok" x="444" y="276" width="176" height="136" rx="10"/>
  <rect x="456" y="288" width="36" height="22" rx="11" fill="#1a7f37"/>
  <text class="badge" x="474" y="304" text-anchor="middle">§5</text>
  <text class="h" x="458" y="336">Validate</text>
  <text class="s" x="458" y="358">Pydantic checks</text>
  <text class="s" x="458" y="377">every field and gives</text>
  <text class="s" x="458" y="396">you a typed object</text>

  <rect class="res" x="654" y="276" width="176" height="136" rx="10"/>
  <rect x="666" y="288" width="64" height="22" rx="11" fill="#8250df"/>
  <text class="badge" x="698" y="304" text-anchor="middle">§4 · §5</text>
  <text class="h" x="668" y="336">The response</text>
  <text class="s" x="668" y="358">status code</text>
  <text class="s" x="668" y="377">+ headers</text>
  <text class="s" x="668" y="396">+ JSON body</text>

  <!-- success: response -> validate -->
  <path class="arrow" d="M652 344 H624" marker-end="url(#ag)"/>
  <text class="s b halo" x="638" y="335" text-anchor="middle" fill="#1a7f37">2xx</text>

  <!-- failure: response -> error box, then retry back through the client -->
  <path d="M742 414 V440 H322 V416" fill="none" stroke="#9a6700" stroke-width="1.6" marker-end="url(#aa)"/>
  <text class="s muted halo" x="532" y="434" text-anchor="middle">4xx, 5xx or no response at all</text>
  <path d="M322 274 V228" fill="none" stroke="#9a6700" stroke-width="1.6" marker-end="url(#aa)"/>
  <text class="s b" x="330" y="256" fill="#7d4e00">retry</text>
</svg>
