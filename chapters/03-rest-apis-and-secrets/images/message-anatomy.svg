<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 690" width="860" height="690" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a URL, a request and a response</title>
  <desc id="desc">Part 1: the URL https://api.example.com/v1/notes?limit=10 split into scheme, host, path and query string. The path and query string go in the request line, the host goes in the Host header. Part 2: a POST request (request line, headers, empty line, JSON body) and its 201 Created response (status line, headers, empty line, body), each part labelled with the httpx2 attribute that exposes it: r.request.method, r.request.url, r.request.headers, r.request.content, r.status_code, r.reason_phrase, r.http_version, r.headers and r.json().</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .msg { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .url { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13.5px; fill: #59636e; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 13px; }
    .muted { fill: #59636e; }
    .b { font-weight: 700; }
    .code { fill: #116329; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .req { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .res { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .dots { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 2 3; }
  </style>

  <rect class="card" x="0.5" y="0.5" width="859" height="689" rx="14"/>
  <text class="title" x="28" y="40">Anatomy of a URL, a request and a response</text>
  <text class="sub" x="28" y="64">The raw HTTP text on the left; on the right, where httpx2 gives you each part.</text>

  <!-- 1. The URL -->
  <text class="h" x="28" y="102">1 · A URL, piece by piece</text>

  <text class="s muted" x="84" y="128" text-anchor="middle">scheme</text>
  <text class="s muted" x="209" y="128" text-anchor="middle">host</text>
  <text class="s muted" x="340" y="128" text-anchor="middle">path</text>
  <text class="s muted" x="444" y="128" text-anchor="middle">query string</text>

  <rect x="40" y="136" width="88" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <rect x="132" y="136" width="154" height="32" rx="6" fill="#e3f6f7" stroke="#1b7c83" stroke-width="1.5"/>
  <rect x="290" y="136" width="100" height="32" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <rect x="394" y="136" width="100" height="32" rx="6" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
  <text class="url" x="84" y="157" text-anchor="middle">https://</text>
  <text class="url" x="209" y="157" text-anchor="middle" fill="#1b7c83">api.example.com</text>
  <text class="url" x="340" y="157" text-anchor="middle" fill="#0550ae">/v1/notes</text>
  <text class="url" x="444" y="157" text-anchor="middle" fill="#7d4e00">?limit=10</text>

  <!-- where the pieces end up -->
  <rect x="40" y="190" width="454" height="72" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text class="msg" x="56" y="218">GET <tspan class="b" fill="#0550ae">/v1/notes</tspan><tspan class="b" fill="#7d4e00">?limit=10</tspan> HTTP/1.1</text>
  <text class="msg" x="56" y="244">Host: <tspan class="b" fill="#1b7c83">api.example.com</tspan></text>
  <text class="s muted" x="40" y="286">what httpx2 sends for <tspan class="mono">client.get("/v1/notes", params={"limit": 10})</tspan></text>

  <circle cx="540" cy="145" r="5" fill="#8c959f"/>
  <text class="s" x="554" y="150"><tspan class="b">scheme:</tspan> https = HTTP encrypted with TLS</text>
  <circle cx="540" cy="171" r="5" fill="#1b7c83"/>
  <text class="s" x="554" y="176"><tspan class="b">host:</tspan> sent in the Host header</text>
  <circle cx="540" cy="197" r="5" fill="#0969da"/>
  <text class="s" x="554" y="202"><tspan class="b">path:</tspan> goes in the request line</text>
  <circle cx="540" cy="223" r="5" fill="#bf8700"/>
  <text class="s" x="554" y="228"><tspan class="b">query:</tspan> in the request line too,</text>
  <text class="s" x="554" y="248">built from <tspan class="mono">params=</tspan> by httpx2</text>

  <!-- 2. Request and response -->
  <text class="h" x="28" y="326">2 · A request and its response</text>
  <text class="h" x="556" y="326" fill="#116329">In httpx2 <tspan class="mono muted" font-weight="400">r = client.post(...)</tspan></text>

  <!-- request -->
  <rect class="req" x="40" y="342" width="480" height="170" rx="10"/>
  <path d="M150 342 V512" stroke="#54aeff" stroke-width="1"/>
  <path d="M40 374 H520 M40 450 H520 M40 476 H520" stroke="#54aeff" stroke-width="1"/>
  <g class="s" fill="#0550ae" text-anchor="end">
    <text x="140" y="363" class="s" fill="#0550ae">request line</text>
    <text x="140" y="418" class="s" fill="#0550ae">headers</text>
    <text x="140" y="468" class="s" fill="#0550ae">empty line</text>
    <text x="140" y="499" class="s" fill="#0550ae">body</text>
  </g>
  <text class="msg" x="162" y="363"><tspan class="b">POST</tspan> /v1/notes HTTP/1.1</text>
  <text class="msg" x="162" y="396">Host: api.example.com</text>
  <text class="msg" x="162" y="418">Authorization: Bearer sk-…</text>
  <text class="msg" x="162" y="440">Content-Type: application/json</text>
  <text class="s muted" x="162" y="468">(nothing: marks the end of the headers)</text>
  <text class="msg" x="162" y="499">{"text": "read MDN"}</text>

  <path class="dots" d="M524 359 H548 M524 414 H548 M524 464 H548 M524 495 H548"/>
  <text class="mono code" x="556" y="363">r.request.method <tspan class="muted">·</tspan> r.request.url</text>
  <text class="mono code" x="556" y="418">r.request.headers</text>
  <text class="s muted" x="556" y="468">(handled for you)</text>
  <text class="mono code" x="556" y="499">r.request.content</text>

  <!-- response -->
  <rect class="res" x="40" y="532" width="480" height="140" rx="10"/>
  <path d="M150 532 V672" stroke="#c297ff" stroke-width="1"/>
  <path d="M40 564 H520 M40 618 H520 M40 640 H520" stroke="#c297ff" stroke-width="1"/>
  <text x="140" y="553" class="s" fill="#6639ba" text-anchor="end">status line</text>
  <text x="140" y="596" class="s" fill="#6639ba" text-anchor="end">headers</text>
  <text x="140" y="634" class="s" fill="#6639ba" text-anchor="end">empty line</text>
  <text x="140" y="661" class="s" fill="#6639ba" text-anchor="end">body</text>
  <text class="msg" x="162" y="553">HTTP/1.1 <tspan class="b">201 Created</tspan></text>
  <text class="msg" x="162" y="585">Content-Type: application/json</text>
  <text class="msg" x="162" y="607">Location: /v1/notes/1</text>
  <text class="s muted" x="162" y="634">(nothing: marks the end of the headers)</text>
  <text class="msg" x="162" y="661">{"id": 1, "text": "read MDN"}</text>

  <path class="dots" d="M524 549 H548 M524 592 H548 M524 630 H548 M524 657 H548"/>
  <text class="mono code" x="556" y="545">r.status_code <tspan class="muted">·</tspan> r.reason_phrase</text>
  <text class="mono code" x="556" y="563">r.http_version</text>
  <text class="mono code" x="556" y="596">r.headers["Location"]</text>
  <text class="s muted" x="556" y="634">(handled for you)</text>
  <text class="mono code" x="556" y="661">r.json() <tspan class="muted">·</tspan> r.text</text>
</svg>
