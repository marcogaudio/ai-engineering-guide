<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 622" width="860" height="622" role="img" aria-labelledby="title desc">
  <title id="title">An LLM call with no SDK</title>
  <desc id="desc">What 07_raw_llm_call.py does. LLMSettings reads LLM_BASE_URL, LLM_API_KEY and LLM_MODEL from the environment or .env. An httpx2.Client with the Bearer key header and Timeout(120.0, connect=5.0) sends POST /chat/completions with a JSON body to an LLM server (Ollama on localhost:11434, or any OpenAI-compatible API). The 200 OK JSON response is validated with ChatCompletion.model_validate, and the answer is completion.choices[0].message.content. Streaming: the same POST with "stream": true returns one response with Content-Type: text/event-stream; its body arrives as data: lines, each carrying a small delta of text, until data: [DONE]. The loop prints the text as it grows.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13.5px; fill: #59636e; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 13px; }
    .muted { fill: #59636e; }
    .b { font-weight: 700; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .arrow { fill: none; stroke: #6e7781; stroke-width: 1.6; }
    .neu { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .sec { fill: #ffeff7; stroke: #bf3989; stroke-width: 1.5; }
    .req { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .res { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="859" height="621" rx="14"/>
  <text class="title" x="28" y="40">An LLM call with no SDK</text>
  <text class="sub" x="28" y="64">What <tspan class="mono">07_raw_llm_call.py</tspan> does: plain httpx2, JSON and Pydantic, then the same call streamed.</text>

  <!-- Row 1: settings -> client -> request -> server -->
  <rect class="sec" x="24" y="86" width="176" height="128" rx="10"/>
  <text class="mono b" x="38" y="112" fill="#99286e">LLMSettings()</text>
  <text class="s muted" x="38" y="134">from the env / .env:</text>
  <text class="mono" x="38" y="158">LLM_BASE_URL</text>
  <text class="mono" x="38" y="178">LLM_API_KEY</text>
  <text class="mono" x="38" y="198">LLM_MODEL</text>

  <rect class="neu" x="234" y="86" width="176" height="128" rx="10"/>
  <text class="mono b" x="248" y="112">httpx2.Client</text>
  <text class="s" x="248" y="134">base_url, and the</text>
  <text class="s" x="248" y="154">Bearer key header</text>
  <text class="mono" x="248" y="178">Timeout(120.0,</text>
  <text class="mono" x="264" y="198">connect=5.0)</text>

  <rect class="req" x="444" y="86" width="176" height="128" rx="10"/>
  <text class="h" x="458" y="112">The request</text>
  <text class="mono b" x="458" y="134" fill="#0550ae">POST</text>
  <text class="mono" x="458" y="154">/chat/completions</text>
  <text class="mono" x="458" y="178">{"model": …,</text>
  <text class="mono" x="466" y="198">"messages": […]}</text>

  <rect class="neu" x="654" y="86" width="176" height="128" rx="10"/>
  <text class="h" x="668" y="112">LLM server</text>
  <text class="s" x="668" y="134">Ollama on</text>
  <text class="mono" x="668" y="154">localhost:11434</text>
  <text class="s" x="668" y="178">or any OpenAI-</text>
  <text class="s" x="668" y="198">compatible API</text>

  <path class="arrow" d="M202 150 H230" marker-end="url(#ag)"/>
  <path class="arrow" d="M412 150 H440" marker-end="url(#ag)"/>
  <path class="arrow" d="M622 150 H650" marker-end="url(#ag)"/>
  <path class="arrow" d="M742 216 V258" marker-end="url(#ag)"/>

  <!-- Row 2: (SDK note) | answer <- validate <- response -->
  <rect x="24" y="262" width="176" height="128" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="h" x="38" y="288">With an SDK</text>
  <text class="s" x="38" y="310">one method call does</text>
  <text class="s" x="38" y="330">all of this, plus</text>
  <text class="s" x="38" y="350">retries, typed errors</text>
  <text class="s" x="38" y="370">and stream helpers</text>

  <rect class="neu" x="234" y="262" width="176" height="128" rx="10"/>
  <text class="h" x="248" y="288">The answer</text>
  <text class="mono" x="248" y="310">completion</text>
  <text class="mono" x="248" y="330">.choices[0]</text>
  <text class="mono" x="248" y="350">.message.content</text>
  <text class="s muted" x="248" y="372">"A REST API is…"</text>

  <rect class="ok" x="444" y="262" width="176" height="128" rx="10"/>
  <text class="h" x="458" y="288">Validate</text>
  <text class="mono" x="458" y="310">ChatCompletion</text>
  <text class="mono" x="458" y="330">.model_validate(</text>
  <text class="mono" x="466" y="350">r.json())</text>
  <text class="s muted" x="458" y="372">typed and checked</text>

  <rect class="res" x="654" y="262" width="176" height="128" rx="10"/>
  <text class="h" x="668" y="288">The response</text>
  <text class="mono b" x="668" y="310" fill="#6639ba">200 OK</text>
  <text class="mono" x="668" y="332">{"choices": [</text>
  <text class="mono" x="676" y="352">{"message": …}],</text>
  <text class="mono" x="676" y="372">"usage": {…}}</text>

  <path class="arrow" d="M652 326 H624" marker-end="url(#ag)"/>
  <path class="arrow" d="M442 326 H414" marker-end="url(#ag)"/>

  <path d="M28 414 H832" stroke="#d0d7de" stroke-width="1"/>

  <!-- Streaming -->
  <text class="h" x="28" y="446">Streaming: the same POST with <tspan class="mono" font-weight="400">"stream": true</tspan></text>
  <text class="s muted" x="28" y="468">One response with <tspan class="mono">Content-Type: text/event-stream</tspan>: the body arrives one <tspan class="mono">data:</tspan> line at a time.</text>

  <rect class="res" x="40" y="486" width="118" height="50" rx="8"/>
  <rect class="res" x="166" y="486" width="118" height="50" rx="8"/>
  <rect class="res" x="292" y="486" width="118" height="50" rx="8"/>
  <rect class="res" x="418" y="486" width="118" height="50" rx="8"/>
  <rect class="res" x="544" y="486" width="118" height="50" rx="8"/>
  <rect class="neu" x="670" y="486" width="118" height="50" rx="8"/>
  <g class="mono" text-anchor="middle">
    <text class="mono" x="99" y="506">data: {…}</text>
    <text class="mono" x="225" y="506">data: {…}</text>
    <text class="mono" x="351" y="506">data: {…}</text>
    <text class="mono" x="477" y="506">data: {…}</text>
    <text class="mono" x="603" y="506">data: {…}</text>
    <text class="mono b" x="729" y="506">data: [DONE]</text>
  </g>
  <g text-anchor="middle">
    <text class="s muted" x="99" y="526">delta: "A"</text>
    <text class="s muted" x="225" y="526">delta: " REST"</text>
    <text class="s muted" x="351" y="526">delta: " API"</text>
    <text class="s muted" x="477" y="526">delta: " is"</text>
    <text class="s muted" x="603" y="526">delta: " a set…"</text>
    <text class="s muted" x="729" y="526">end of stream</text>
  </g>

  <path d="M40 552 H826" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#ag)"/>
  <text class="s muted" x="822" y="572" text-anchor="end">time</text>

  <text class="s muted" x="40" y="580">what your loop has printed so far:</text>
  <g text-anchor="middle">
    <text class="mono" x="99" y="604">A</text>
    <text class="mono" x="225" y="604">A REST</text>
    <text class="mono" x="351" y="604">A REST API</text>
    <text class="mono" x="477" y="604">A REST API is</text>
    <text class="mono" x="603" y="604">…is a set…</text>
    <text class="mono muted" x="729" y="604">(stop)</text>
  </g>
</svg>
