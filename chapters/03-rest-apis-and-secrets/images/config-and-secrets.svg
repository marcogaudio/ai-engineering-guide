<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Where the API key lives</title>
  <desc id="desc">Three config sources in priority order: real environment variables, then the .env file, then the defaults in the class. pydantic-settings reads them into Settings(), converts types, fails at startup when api_key is missing, and wraps the key in SecretStr, so print(settings) shows SecretStr('**********'). The key is unwrapped with .get_secret_value() only to build the Authorization: Bearer header of the request, never put in the URL, because URLs end up in logs. Bottom: .gitignore blocks .env (real values, stays local) and allows .env.example (placeholders) through with the !.env.example rule, so only .env.example is committed. Git history keeps every commit forever, so a leaked key must be rotated, not just deleted.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13.5px; fill: #59636e; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 13px; }
    .muted { fill: #59636e; }
    .b { font-weight: 700; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .arrow { fill: none; stroke: #6e7781; stroke-width: 1.6; }
    .neu { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .sec { fill: #ffeff7; stroke: #bf3989; stroke-width: 1.5; }
    .req { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.5; }
    .fix { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="859" height="539" rx="14"/>
  <text class="title" x="28" y="40">Where the API key lives</text>
  <text class="sub" x="28" y="64">From the environment, through pydantic-settings, into one request header. Never into code, logs, URLs or git.</text>

  <!-- Sources, highest priority first -->
  <text class="s b muted" x="40" y="100">Sources, highest priority first</text>

  <rect class="neu" x="40" y="112" width="230" height="62" rx="10"/>
  <circle cx="60" cy="143" r="12" fill="#57606a"/>
  <text class="num" x="60" y="148" text-anchor="middle">1</text>
  <text class="h" x="82" y="139">Environment variables</text>
  <text class="mono" x="82" y="161">export LLM_API_KEY=…</text>

  <rect class="neu" x="40" y="186" width="230" height="62" rx="10"/>
  <circle cx="60" cy="217" r="12" fill="#57606a"/>
  <text class="num" x="60" y="222" text-anchor="middle">2</text>
  <text class="h" x="82" y="213">.env file</text>
  <text class="mono" x="82" y="235">LLM_API_KEY=sk-…</text>

  <rect class="neu" x="40" y="260" width="230" height="62" rx="10"/>
  <circle cx="60" cy="291" r="12" fill="#57606a"/>
  <text class="num" x="60" y="296" text-anchor="middle">3</text>
  <text class="h" x="82" y="287">Defaults in the class</text>
  <text class="mono" x="82" y="309">base_url = "http://…"</text>

  <path class="arrow" d="M272 143 L316 207" marker-end="url(#ag)"/>
  <path class="arrow" d="M272 217 H316" marker-end="url(#ag)"/>
  <path class="arrow" d="M272 291 L316 227" marker-end="url(#ag)"/>

  <!-- Settings() -->
  <rect class="sec" x="320" y="112" width="240" height="210" rx="10"/>
  <text class="mono b" x="334" y="138" font-size="15" fill="#99286e">Settings()</text>
  <text class="s muted" x="334" y="158">pydantic-settings</text>
  <text class="s" x="334" y="186">• reads the env, then .env</text>
  <text class="s" x="334" y="206">• converts types: "10" → 10.0</text>
  <text class="s" x="334" y="226">• no api_key? fails at startup</text>
  <rect x="332" y="242" width="216" height="66" rx="8" fill="#ffffff" stroke="#f0b6d3" stroke-width="1"/>
  <text class="s muted" x="344" y="266">print(settings) shows</text>
  <text class="mono" x="344" y="290" fill="#99286e">SecretStr('**********')</text>

  <path class="arrow" d="M562 217 H646" marker-end="url(#ag)"/>

  <!-- The request -->
  <rect class="req" x="650" y="140" width="186" height="154" rx="10"/>
  <text class="h" x="664" y="166">The request</text>
  <text class="s" x="664" y="188">unwrap only here:</text>
  <text class="mono" x="664" y="208" fill="#0550ae">.get_secret_value()</text>
  <rect x="660" y="220" width="166" height="62" rx="8" fill="#ffffff" stroke="#9cd0ff" stroke-width="1"/>
  <text class="mono" x="670" y="244">Authorization:</text>
  <text class="mono" x="670" y="266">Bearer sk-…</text>
  <text class="s b" x="664" y="316" fill="#a40e26">never in the URL:</text>
  <text class="s" x="664" y="334" fill="#a40e26">URLs end up in logs</text>

  <path d="M28 356 H832" stroke="#d0d7de" stroke-width="1"/>

  <!-- What goes into git -->
  <text class="h" x="28" y="388">What goes into git</text>

  <rect class="fix" x="40" y="404" width="230" height="50" rx="10"/>
  <text class="mono b" x="56" y="425">.env</text>
  <text class="s" x="56" y="444">real values · stays local</text>

  <rect class="ok" x="40" y="470" width="230" height="50" rx="10"/>
  <text class="mono b" x="56" y="491">.env.example</text>
  <text class="s" x="56" y="510">placeholders · committed</text>

  <rect class="neu" x="330" y="404" width="190" height="116" rx="10"/>
  <text class="mono b" x="346" y="426">.gitignore</text>
  <text class="mono" x="346" y="450">.env</text>
  <text class="mono" x="346" y="470">.env.*</text>
  <text class="mono" x="346" y="490">!.env.example</text>
  <text class="s muted" x="346" y="510">! means "except"</text>

  <rect class="neu" x="610" y="404" width="226" height="116" rx="10"/>
  <text class="h" x="626" y="428">Git repository</text>
  <text class="s" x="626" y="450">keeps every commit</text>
  <text class="s" x="626" y="470">forever, so a leaked</text>
  <text class="s" x="626" y="490">key must be rotated,</text>
  <text class="s" x="626" y="510">not just deleted</text>

  <path d="M272 429 H326" fill="none" stroke="#cf222e" stroke-width="1.6" marker-end="url(#ar)"/>
  <text class="s b halo" x="299" y="421" text-anchor="middle" fill="#a40e26">blocked</text>
  <path d="M272 495 H326" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#ao)"/>
  <text class="s b halo" x="299" y="487" text-anchor="middle" fill="#116329">allowed</text>
  <path d="M522 462 H606" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#ao)"/>
  <text class="s b halo" x="564" y="454" text-anchor="middle" fill="#116329">committed</text>
</svg>
