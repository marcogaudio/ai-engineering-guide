<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="title desc">
  <title id="title">The three layers of the AI stack</title>
  <desc id="desc">Three stacked layers. Top: application development (prompts, context, evaluation, the product), where most AI engineers work. Middle: model development (training, finetuning, dataset engineering, inference optimization). Bottom: infrastructure (serving, compute, monitoring). With a hosted model API, the provider runs most of the bottom two layers, so you start at the top.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13.5px; fill: #59636e; }
    .layer { font-size: 16px; font-weight: 700; }
    .note { font-size: 13.5px; fill: #59636e; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .app { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .model { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .infra { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .chip-app { fill: #ffffff; stroke: #54aeff; stroke-width: 1.2; }
    .chip-model { fill: #ffffff; stroke: #c297ff; stroke-width: 1.2; }
    .chip-infra { fill: #ffffff; stroke: #afb8c1; stroke-width: 1.2; }
  </style>

  <rect class="card" x="0.5" y="0.5" width="859" height="469" rx="14"/>
  <text class="title" x="28" y="40">The three layers of the AI stack</text>
  <text class="sub" x="28" y="64">Each layer builds on the one below it. Building on a foundation model, you work mostly at the top.</text>

  <!-- Application development -->
  <rect class="app" x="24" y="86" width="812" height="104" rx="12"/>
  <text class="layer" x="44" y="130">Application development</text>
  <text class="sub" x="44" y="152" font-weight="600" fill="#0550ae">where most AI engineers work</text>
  <g text-anchor="middle" fill="#0550ae">
    <rect class="chip-app" x="330" y="122" width="84" height="32" rx="16"/>
    <text x="372" y="143" fill="#0550ae">prompts</text>
    <rect class="chip-app" x="424" y="122" width="84" height="32" rx="16"/>
    <text x="466" y="143" fill="#0550ae">context</text>
    <rect class="chip-app" x="518" y="122" width="106" height="32" rx="16"/>
    <text x="571" y="143" fill="#0550ae">evaluation</text>
    <rect class="chip-app" x="634" y="122" width="116" height="32" rx="16"/>
    <text x="692" y="143" fill="#0550ae">the product</text>
  </g>

  <!-- Model development -->
  <rect class="model" x="24" y="202" width="812" height="104" rx="12"/>
  <text class="layer" x="44" y="246">Model development</text>
  <text class="sub" x="44" y="268">building or adapting the model itself</text>
  <g text-anchor="middle">
    <rect class="chip-model" x="330" y="220" width="92" height="32" rx="16"/>
    <text x="376" y="241" fill="#6639ba">training</text>
    <rect class="chip-model" x="432" y="220" width="108" height="32" rx="16"/>
    <text x="486" y="241" fill="#6639ba">finetuning</text>
    <rect class="chip-model" x="550" y="220" width="176" height="32" rx="16"/>
    <text x="638" y="241" fill="#6639ba">dataset engineering</text>
    <rect class="chip-model" x="330" y="258" width="200" height="32" rx="16"/>
    <text x="430" y="279" fill="#6639ba">inference optimization</text>
  </g>

  <!-- Infrastructure -->
  <rect class="infra" x="24" y="318" width="812" height="104" rx="12"/>
  <text class="layer" x="44" y="362">Infrastructure</text>
  <text class="sub" x="44" y="384">running models and apps reliably</text>
  <g text-anchor="middle">
    <rect class="chip-infra" x="330" y="354" width="84" height="32" rx="16"/>
    <text x="372" y="375" fill="#424a53">serving</text>
    <rect class="chip-infra" x="424" y="354" width="88" height="32" rx="16"/>
    <text x="468" y="375" fill="#424a53">compute</text>
    <rect class="chip-infra" x="522" y="354" width="106" height="32" rx="16"/>
    <text x="575" y="375" fill="#424a53">monitoring</text>
  </g>

  <text class="note" x="28" y="452">With a hosted model API, the provider runs most of the bottom two layers for you: you start at the top.</text>
</svg>
